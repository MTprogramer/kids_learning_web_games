<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#EFFFE9"/>
            <stop offset="50%" stop-color="#C8F7C5"/>
            <stop offset="100%" stop-color="#8CE89A"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sparkles -->
    <circle cx="18" cy="22" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="112" cy="20" r="3" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="111" cy="50" r="3" fill="#FFFFFF" opacity="0.4"/>

    <!-- letter tile -->
    <rect x="10" y="40" width="46" height="46" rx="14" fill="#2E9E45"/>
    <text x="33" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF">A</text>

    <!-- connector -->
    <circle cx="60" cy="63" r="6" fill="#FFFFFF" stroke="#2E9E45" stroke-width="3"/>
    <circle cx="68" cy="63" r="6" fill="#FFFFFF" stroke="#1E73C9" stroke-width="3"/>
    <line x1="60" y1="63" x2="68" y2="63" stroke="#43C463" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>

    <!-- picture tile -->
    <rect x="72" y="40" width="46" height="46" rx="14" fill="#FFFFFF" opacity="0.9"/>
    <text x="95" y="73" text-anchor="middle" font-size="30">🍎</text>

    <!-- title badge -->
    <rect x="14" y="96" width="100" height="22" rx="11" fill="#FFFFFF" opacity="0.85"/>
    <text x="64" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#1B5E20">Connect!</text>
</svg>
