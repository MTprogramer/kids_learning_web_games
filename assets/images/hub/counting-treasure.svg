<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFF8E1"/>
            <stop offset="50%" stop-color="#FFE0A3"/>
            <stop offset="100%" stop-color="#FFC247"/>
        </linearGradient>
        <linearGradient id="chestGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#D8923F"/>
            <stop offset="100%" stop-color="#8B5A2B"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sparkles -->
    <circle cx="20" cy="24" r="3" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="110" cy="30" r="4" fill="#FFFFFF" opacity="0.5"/>

    <!-- coins flying -->
    <circle cx="28" cy="46" r="11" fill="#FFD700" stroke="#C9A227" stroke-width="2"/>
    <circle cx="100" cy="40" r="9" fill="#FFD700" stroke="#C9A227" stroke-width="2"/>
    <circle cx="98" cy="64" r="7" fill="#FFE38A" stroke="#C9A227" stroke-width="2"/>

    <!-- chest base -->
    <rect x="24" y="68" width="80" height="42" rx="8" fill="url(#chestGrad)" stroke="#6B4423" stroke-width="4"/>
    <!-- chest lid -->
    <path d="M22 70 Q64 40 106 70 L106 76 Q64 50 22 76 Z" fill="#D8923F" stroke="#6B4423" stroke-width="4"/>
    <!-- lock -->
    <rect x="56" y="68" width="16" height="16" rx="4" fill="#FFD700" stroke="#C9A227" stroke-width="3"/>

    <!-- highlight -->
    <ellipse cx="40" cy="78" rx="14" ry="6" fill="#FFFFFF" opacity="0.15"/>
</svg>
