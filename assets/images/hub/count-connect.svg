<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFF8E1"/>
            <stop offset="50%" stop-color="#FFEFC2"/>
            <stop offset="100%" stop-color="#C8F7C5"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sparkles -->
    <circle cx="18" cy="22" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="112" cy="20" r="3" fill="#FFFFFF" opacity="0.5"/>

    <!-- group tile -->
    <rect x="8" y="38" width="58" height="50" rx="16" fill="#FFFFFF" opacity="0.9"/>
    <text x="16" y="66" font-size="20">🍓</text>
    <text x="38" y="66" font-size="20">🍓</text>
    <text x="16" y="86" font-size="20">🍓</text>

    <!-- connector -->
    <circle cx="68" cy="63" r="6" fill="#FFFFFF" stroke="#52C41A" stroke-width="3"/>
    <circle cx="76" cy="63" r="6" fill="#FFFFFF" stroke="#FFB627" stroke-width="3"/>
    <line x1="68" y1="63" x2="76" y2="63" stroke="#43C463" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>

    <!-- number tile -->
    <rect x="80" y="40" width="40" height="46" rx="14" fill="#FFB627"/>
    <text x="100" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF">3</text>

    <!-- title badge -->
    <rect x="14" y="96" width="100" height="22" rx="11" fill="#FFFFFF" opacity="0.85"/>
    <text x="64" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#2E7D32">Count!</text>
</svg>
