<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E3F2FD"/>
            <stop offset="50%" stop-color="#90CAF9"/>
            <stop offset="100%" stop-color="#42A5F5"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sun with filled triangular rays -->
    <g fill="#FFD54F">
        <polygon points="40,8 44,20 36,20"/>
        <polygon points="40,72 44,60 36,60"/>
        <polygon points="8,40 20,44 20,36"/>
        <polygon points="72,40 60,44 60,36"/>
        <polygon points="18,18 28,24 24,28"/>
        <polygon points="62,18 52,24 56,28"/>
        <polygon points="18,62 28,56 24,52"/>
    </g>
    <circle cx="40" cy="40" r="16" fill="#FFD54F"/>
    <circle cx="35" cy="35" r="5" fill="#FFF3C4" opacity="0.7"/>

    <!-- cloud -->
    <ellipse cx="80" cy="62" rx="28" ry="18" fill="#FFFFFF"/>
    <ellipse cx="62" cy="68" rx="16" ry="12" fill="#FFFFFF"/>
    <ellipse cx="98" cy="70" rx="16" ry="12" fill="#FFFFFF"/>

    <!-- rain drops -->
    <path d="M60 92 q4 8 0 12 q-4-4 0-12 Z" fill="#1E88E5"/>
    <path d="M80 96 q4 8 0 12 q-4-4 0-12 Z" fill="#1E88E5"/>
    <path d="M100 92 q4 8 0 12 q-4-4 0-12 Z" fill="#1E88E5"/>
</svg>
