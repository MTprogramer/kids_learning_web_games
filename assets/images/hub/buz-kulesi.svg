<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Buz Kulesi: dikey kristal kule + zıplayan karakter + kar tanesi -->
  <defs>
    <linearGradient id="bk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a40"/>
      <stop offset="1" stop-color="#0a3a78"/>
    </linearGradient>
    <linearGradient id="bk-ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f0ff"/>
      <stop offset="0.45" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#0288D1"/>
    </linearGradient>
  </defs>

  <!-- Arka plan (gece gökyüzü) -->
  <rect x="0" y="0" width="96" height="96" rx="14" fill="url(#bk-sky)"/>

  <!-- Yıldızlar -->
  <circle cx="14" cy="14" r="1.2" fill="#e7f3ff" opacity="0.9"/>
  <circle cx="78" cy="20" r="1" fill="#e7f3ff" opacity="0.8"/>
  <circle cx="22" cy="30" r="0.8" fill="#e7f3ff" opacity="0.7"/>
  <circle cx="82" cy="42" r="1.1" fill="#e7f3ff" opacity="0.9"/>

  <!-- Uzak kule gölgesi -->
  <polygon points="48,26 60,46 60,90 36,90 36,46" fill="#0a2a55" opacity="0.55"/>

  <!-- Buz Kulesi — kristal yapı -->
  <!-- Ana gövde -->
  <polygon points="48,18 64,38 64,90 32,90 32,38" fill="url(#bk-ice)" stroke="#0288D1" stroke-width="1.2"/>

  <!-- Kule katları (platform şeritleri) -->
  <rect x="32" y="46" width="32" height="3" fill="#d6f0ff" opacity="0.9"/>
  <rect x="32" y="46" width="32" height="1" fill="#ffffff"/>
  <rect x="32" y="62" width="32" height="3" fill="#d6f0ff" opacity="0.9"/>
  <rect x="32" y="62" width="32" height="1" fill="#ffffff"/>
  <rect x="32" y="78" width="32" height="3" fill="#d6f0ff" opacity="0.9"/>
  <rect x="32" y="78" width="32" height="1" fill="#ffffff"/>

  <!-- Üst tepe parlaması -->
  <polygon points="48,18 56,30 40,30" fill="#ffffff" opacity="0.75"/>
  <polygon points="48,18 52,26 44,26" fill="#ffffff"/>

  <!-- Kristal ışıltıları -->
  <rect x="38" y="38" width="2" height="6" fill="#ffffff" opacity="0.55"/>
  <rect x="56" y="52" width="2" height="6" fill="#ffffff" opacity="0.55"/>
  <rect x="42" y="68" width="2" height="6" fill="#ffffff" opacity="0.55"/>

  <!-- Karakter (kar adamı) - en üst platforma zıplıyor -->
  <!-- Şal -->
  <rect x="44" y="40" width="8" height="2" fill="#1e88e5"/>
  <rect x="45" y="42" width="2" height="3" fill="#1565c0"/>
  <!-- Gövde -->
  <circle cx="48" cy="38" r="4.5" fill="#ffffff" stroke="#cce7f4" stroke-width="0.5"/>
  <!-- Yüz -->
  <circle cx="46.5" cy="37" r="0.7" fill="#1a1a1a"/>
  <circle cx="49.5" cy="37" r="0.7" fill="#1a1a1a"/>
  <!-- Yanak -->
  <circle cx="45.5" cy="39" r="0.8" fill="#ff8a8a" opacity="0.85"/>
  <circle cx="50.5" cy="39" r="0.8" fill="#ff8a8a" opacity="0.85"/>
  <!-- Burun (havuç) -->
  <polygon points="48,38 50,38.5 48,39" fill="#ff8c2a"/>

  <!-- Hareket çizgileri (zıplama efekti) -->
  <line x1="40" y1="46" x2="38" y2="50" stroke="#a9e8ff" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="46" x2="58" y2="50" stroke="#a9e8ff" stroke-width="1" opacity="0.6"/>

  <!-- Kar taneleri -->
  <circle cx="18" cy="50" r="1.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="76" cy="58" r="1" fill="#ffffff" opacity="0.75"/>
  <circle cx="14" cy="72" r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="82" cy="76" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="22" cy="84" r="1.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="74" cy="86" r="0.9" fill="#ffffff" opacity="0.7"/>
  <circle cx="10" cy="36" r="0.9" fill="#ffffff" opacity="0.7"/>
</svg>
