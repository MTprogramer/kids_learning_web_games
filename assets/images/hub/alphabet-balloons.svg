<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE0EE"/>
            <stop offset="100%" stop-color="#FF6FAE"/>
        </linearGradient>
        <radialGradient id="balloonYellow" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFF3B0"/>
            <stop offset="100%" stop-color="#FFC107"/>
        </radialGradient>
        <radialGradient id="balloonBlue" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#BEE3FF"/>
            <stop offset="100%" stop-color="#4D96FF"/>
        </radialGradient>
        <radialGradient id="balloonGreen" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#D4F7D4"/>
            <stop offset="100%" stop-color="#6BCB77"/>
        </radialGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- clouds -->
    <circle cx="22" cy="24" r="9" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="34" cy="20" r="12" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="102" cy="102" r="10" fill="#FFFFFF" opacity="0.25"/>

    <!-- left balloon (blue) -->
    <ellipse cx="32" cy="58" rx="20" ry="24" fill="url(#balloonBlue)"/>
    <polygon points="32,82 27,89 37,89" fill="#4D96FF"/>
    <line x1="32" y1="89" x2="28" y2="112" stroke="#9AA5B1" stroke-width="2"/>

    <!-- right balloon (green) -->
    <ellipse cx="100" cy="64" rx="18" ry="22" fill="url(#balloonGreen)"/>
    <polygon points="100,86 95,93 105,93" fill="#6BCB77"/>
    <line x1="100" y1="93" x2="104" y2="114" stroke="#9AA5B1" stroke-width="2"/>

    <!-- main balloon (yellow) -->
    <ellipse cx="66" cy="56" rx="30" ry="35" fill="url(#balloonYellow)"/>
    <polygon points="66,91 59,100 73,100" fill="#FFC107"/>
    <line x1="66" y1="100" x2="66" y2="120" stroke="#9AA5B1" stroke-width="2.5"/>

    <text x="66" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF">A</text>

    <!-- highlight -->
    <ellipse cx="56" cy="42" rx="8" ry="10" fill="#FFFFFF" opacity="0.45"/>
</svg>
