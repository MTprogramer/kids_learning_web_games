<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFA15C"/>
            <stop offset="100%" stop-color="#E8590C"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sky decorations -->
    <circle cx="100" cy="28" r="11" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="22" cy="22" r="7" fill="#FFFFFF" opacity="0.2"/>

    <!-- track -->
    <rect x="8" y="104" width="112" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
    <rect x="14" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="34" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="54" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="74" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="94" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="108" y="112" width="6" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>

    <!-- smoke puffs -->
    <circle cx="34" cy="26" r="6" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="42" cy="18" r="8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="53" cy="14" r="6" fill="#FFFFFF" opacity="0.85"/>

    <!-- smoke stack -->
    <rect x="32" y="36" width="12" height="18" rx="3" fill="#FFD27A"/>
    <rect x="29" y="34" width="18" height="6" rx="2" fill="#FFD27A"/>

    <!-- cabin -->
    <rect x="20" y="50" width="36" height="26" rx="8" fill="#FFFFFF"/>
    <circle cx="38" cy="63" r="8" fill="#5DC8FF"/>
    <circle cx="38" cy="63" r="8" fill="none" stroke="#E8590C" stroke-width="2" opacity="0.25"/>

    <!-- main body -->
    <rect x="50" y="60" width="58" height="34" rx="12" fill="#FFFFFF"/>
    <text x="79" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#E8590C">A</text>

    <!-- buffer beam -->
    <rect x="18" y="76" width="92" height="8" rx="4" fill="#FFD27A"/>

    <!-- wheels -->
    <circle cx="36" cy="98" r="10" fill="#5A3A1E"/>
    <circle cx="36" cy="98" r="3.5" fill="#FFD27A"/>
    <circle cx="64" cy="98" r="10" fill="#5A3A1E"/>
    <circle cx="64" cy="98" r="3.5" fill="#FFD27A"/>
    <circle cx="92" cy="98" r="10" fill="#5A3A1E"/>
    <circle cx="92" cy="98" r="3.5" fill="#FFD27A"/>
</svg>
