<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#CFF7FF"/>
            <stop offset="100%" stop-color="#00B4D8"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sun -->
    <circle cx="100" cy="26" r="14" fill="#FFE082" opacity="0.9"/>

    <!-- bubbles -->
    <circle cx="22" cy="34" r="5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="34" cy="22" r="3" fill="#FFFFFF" opacity="0.5"/>

    <!-- fish body -->
    <ellipse cx="70" cy="62" rx="34" ry="22" fill="#FF8A65"/>
    <!-- tail -->
    <polygon points="36,62 14,46 14,78" fill="#FF8A65"/>
    <!-- eye -->
    <circle cx="92" cy="54" r="5" fill="#FFFFFF"/>
    <circle cx="93" cy="54" r="2.5" fill="#2D3436"/>
    <!-- letter -->
    <text x="64" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">F</text>

    <!-- waves -->
    <path d="M0 92 Q16 84 32 92 T64 92 T96 92 T128 92 V128 H0 Z" fill="#FFFFFF" opacity="0.18"/>
    <path d="M0 104 Q16 96 32 104 T64 104 T96 104 T128 104 V128 H0 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- fishing line -->
    <line x1="118" y1="10" x2="92" y2="48" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <circle cx="92" cy="48" r="3" fill="#FFD54F"/>
</svg>
