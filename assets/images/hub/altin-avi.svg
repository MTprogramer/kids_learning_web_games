<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- Deep space arkaplan -->
  <rect x="0" y="0" width="96" height="96" fill="#0a0e27"/>

  <!-- Pixel-grid noktaları (yıldız etkisi) -->
  <rect x="8" y="12" width="2" height="2" fill="#00d4ff"/>
  <rect x="82" y="18" width="2" height="2" fill="#ffd700"/>
  <rect x="18" y="30" width="2" height="2" fill="#ff2e7e"/>
  <rect x="86" y="48" width="2" height="2" fill="#00ff66"/>
  <rect x="6" y="68" width="2" height="2" fill="#ffd700"/>
  <rect x="88" y="78" width="2" height="2" fill="#00d4ff"/>

  <!-- CRT monitör çerçevesi -->
  <rect x="20" y="18" width="56" height="42" fill="#16213e" stroke="#00ff66" stroke-width="2"/>
  <!-- ekran içi -->
  <rect x="24" y="22" width="48" height="34" fill="#050818"/>
  <!-- scanline -->
  <rect x="24" y="28" width="48" height="1" fill="#00ff66" opacity="0.4"/>
  <rect x="24" y="36" width="48" height="1" fill="#00ff66" opacity="0.3"/>
  <rect x="24" y="44" width="48" height="1" fill="#00ff66" opacity="0.4"/>
  <rect x="24" y="52" width="48" height="1" fill="#00ff66" opacity="0.3"/>

  <!-- "$" sembolü ekranda (8-bit altın) -->
  <rect x="42" y="28" width="2" height="2" fill="#ffd700"/>
  <rect x="44" y="28" width="6" height="2" fill="#ffd700"/>
  <rect x="50" y="28" width="2" height="2" fill="#ffd700"/>
  <rect x="46" y="26" width="2" height="2" fill="#ffd700"/>
  <rect x="40" y="30" width="2" height="2" fill="#ffd700"/>
  <rect x="42" y="32" width="2" height="2" fill="#ffd700"/>
  <rect x="44" y="32" width="6" height="2" fill="#ffd700"/>
  <rect x="50" y="34" width="2" height="2" fill="#ffd700"/>
  <rect x="52" y="36" width="2" height="2" fill="#ffd700"/>
  <rect x="40" y="38" width="6" height="2" fill="#ffd700"/>
  <rect x="46" y="38" width="2" height="2" fill="#ffd700"/>
  <rect x="46" y="40" width="2" height="2" fill="#ffd700"/>
  <rect x="46" y="42" width="2" height="2" fill="#ffd700"/>

  <!-- Monitör altlığı -->
  <rect x="38" y="60" width="20" height="4" fill="#1e2a4a" stroke="#00ff66" stroke-width="1"/>
  <rect x="30" y="64" width="36" height="4" fill="#1e2a4a" stroke="#00ff66" stroke-width="1"/>

  <!-- Pixel altın paraları (3D yığın) -->
  <!-- 1. para -->
  <rect x="58" y="72" width="12" height="2" fill="#b89500"/>
  <rect x="56" y="74" width="16" height="2" fill="#ffd700"/>
  <rect x="56" y="76" width="16" height="2" fill="#ffd700"/>
  <rect x="58" y="78" width="12" height="2" fill="#b89500"/>
  <rect x="62" y="75" width="4" height="2" fill="#ff2e7e"/>

  <!-- 2. para -->
  <rect x="68" y="66" width="12" height="2" fill="#b89500"/>
  <rect x="66" y="68" width="16" height="2" fill="#ffd700"/>
  <rect x="66" y="70" width="16" height="2" fill="#ffd700"/>
  <rect x="68" y="72" width="12" height="2" fill="#b89500"/>
  <rect x="72" y="69" width="4" height="2" fill="#00d4ff"/>

  <!-- 3. para (önde solda) -->
  <rect x="44" y="76" width="12" height="2" fill="#b89500"/>
  <rect x="42" y="78" width="16" height="2" fill="#ffd700"/>
  <rect x="42" y="80" width="16" height="2" fill="#ffd700"/>
  <rect x="44" y="82" width="12" height="2" fill="#b89500"/>
  <rect x="48" y="79" width="4" height="2" fill="#00ff66"/>

  <!-- Pixel "INSERT COIN" yazısı (alt) - basitleştirilmiş -->
  <rect x="12" y="86" width="2" height="2" fill="#00ff66"/>
  <rect x="16" y="86" width="2" height="2" fill="#00ff66"/>
  <rect x="20" y="86" width="2" height="2" fill="#00ff66"/>
  <rect x="24" y="86" width="2" height="2" fill="#00ff66"/>
  <rect x="28" y="86" width="2" height="2" fill="#00ff66"/>

  <!-- Sağ alt blink -->
  <rect x="82" y="86" width="3" height="3" fill="#00ff66" opacity="0.8"/>
</svg>
