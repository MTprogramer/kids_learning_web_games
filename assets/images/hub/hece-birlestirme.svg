<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E0FFFA"/>
            <stop offset="50%" stop-color="#B2F5EA"/>
            <stop offset="100%" stop-color="#80E8D8"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- sparkles -->
    <circle cx="18" cy="22" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="112" cy="20" r="3" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="111" cy="50" r="3" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="16" cy="100" r="3" fill="#FFFFFF" opacity="0.4"/>

    <!-- syllable tile 1 -->
    <g transform="rotate(-8 34 40)">
        <rect x="10" y="20" width="48" height="40" rx="12" fill="#FF8FA3"/>
        <text x="34" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">BA</text>
    </g>

    <!-- plus sign -->
    <circle cx="64" cy="40" r="13" fill="#FFFFFF"/>
    <text x="64" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#00897B">+</text>

    <!-- syllable tile 2 -->
    <g transform="rotate(8 94 40)">
        <rect x="70" y="20" width="48" height="40" rx="12" fill="#FFC75F"/>
        <text x="94" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">LL</text>
    </g>

    <!-- arrow down -->
    <path d="M64 66 L64 84 M56 76 L64 86 L72 76" stroke="#00695C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- result badge -->
    <rect x="14" y="92" width="100" height="28" rx="14" fill="#FFFFFF" opacity="0.9"/>
    <text x="64" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#00695C">⚽ BALL</text>
</svg>
