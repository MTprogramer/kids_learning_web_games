<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E8F4FF"/>
            <stop offset="50%" stop-color="#D6E9FF"/>
            <stop offset="100%" stop-color="#FFE3F0"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- clouds -->
    <ellipse cx="22" cy="26" rx="14" ry="8" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="34" cy="22" rx="10" ry="7" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="106" cy="100" rx="14" ry="8" fill="#FFFFFF" opacity="0.7"/>

    <!-- big letter tile -->
    <rect x="10" y="36" width="48" height="56" rx="16" fill="#FF6B6B"/>
    <text x="34" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">A</text>

    <!-- connector -->
    <circle cx="60" cy="64" r="6" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="3"/>
    <circle cx="68" cy="64" r="6" fill="#FFFFFF" stroke="#4D96FF" stroke-width="3"/>
    <line x1="60" y1="64" x2="68" y2="64" stroke="#43C463" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>

    <!-- small letter tile -->
    <rect x="70" y="44" width="48" height="40" rx="16" fill="#4D96FF"/>
    <text x="94" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">a</text>

    <!-- title badge -->
    <rect x="14" y="98" width="100" height="22" rx="11" fill="#FFFFFF" opacity="0.85"/>
    <text x="64" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#1A5276">Big &amp; Small</text>
</svg>
