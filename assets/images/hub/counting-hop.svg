<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E6FFFB"/>
            <stop offset="50%" stop-color="#BAF2D8"/>
            <stop offset="100%" stop-color="#7FE0A8"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- ripples -->
    <circle cx="102" cy="100" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="102" cy="100" r="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>

    <!-- lily pads -->
    <ellipse cx="28" cy="100" rx="22" ry="14" fill="#6FAE3A"/>
    <text x="28" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">1</text>

    <ellipse cx="100" cy="108" rx="22" ry="14" fill="#6FAE3A"/>
    <text x="100" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">3</text>

    <!-- center lily pad with frog -->
    <ellipse cx="64" cy="80" rx="34" ry="20" fill="#8BC34A"/>

    <!-- frog body -->
    <ellipse cx="64" cy="58" rx="26" ry="22" fill="#52C41A"/>
    <!-- eyes -->
    <circle cx="50" cy="40" r="9" fill="#52C41A"/>
    <circle cx="78" cy="40" r="9" fill="#52C41A"/>
    <circle cx="50" cy="40" r="5" fill="#FFFFFF"/>
    <circle cx="78" cy="40" r="5" fill="#FFFFFF"/>
    <circle cx="51" cy="41" r="2.5" fill="#2D3436"/>
    <circle cx="79" cy="41" r="2.5" fill="#2D3436"/>
    <!-- mouth -->
    <path d="M50 66 Q64 76 78 66" stroke="#2D3436" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="44" cy="58" r="5" fill="#FF9999" opacity="0.6"/>
    <circle cx="84" cy="58" r="5" fill="#FF9999" opacity="0.6"/>
</svg>
