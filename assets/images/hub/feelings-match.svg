<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF0F7"/>
            <stop offset="50%" stop-color="#FFD6EC"/>
            <stop offset="100%" stop-color="#FFB8E0"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- theater curtain swags -->
    <path d="M0 0 H30 C26 18 30 30 18 34 C8 30 6 14 0 14 Z" fill="#E84393"/>
    <path d="M128 0 H98 C102 18 98 30 110 34 C120 30 122 14 128 14 Z" fill="#E84393"/>

    <!-- happy face -->
    <circle cx="46" cy="66" r="28" fill="#FFD93D"/>
    <circle cx="37" cy="59" r="4.5" fill="#2D3436"/>
    <circle cx="55" cy="59" r="4.5" fill="#2D3436"/>
    <path d="M33 73 Q46 86 59 73" stroke="#2D3436" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- sad face -->
    <circle cx="90" cy="88" r="20" fill="#90CAF9"/>
    <circle cx="84" cy="83" r="3.2" fill="#2D3436"/>
    <circle cx="96" cy="83" r="3.2" fill="#2D3436"/>
    <path d="M82 97 Q90 89 98 97" stroke="#2D3436" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="84" cy="90" rx="2.4" ry="3.8" fill="#5C9DE5"/>

    <!-- floating heart -->
