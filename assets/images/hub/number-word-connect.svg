<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4B3F8C"/>
            <stop offset="50%" stop-color="#3A3578"/>
            <stop offset="100%" stop-color="#2A2D5C"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

    <!-- stars -->
    <circle cx="20" cy="22" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="110" cy="18" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="100" cy="100" r="2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="16" cy="90" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="60" cy="14" r="1.8" fill="#FFFFFF" opacity="0.7"/>

    <!-- number tile -->
    <rect x="10" y="40" width="46" height="46" rx="14" fill="#FFD166"/>
    <text x="33" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#2A2D5C">1</text>

    <!-- connector -->
    <circle cx="60" cy="63" r="6" fill="#FFFFFF" stroke="#FFD166" stroke-width="3"/>
    <circle cx="68" cy="63" r="6" fill="#FFFFFF" stroke="#06D6A0" stroke-width="3"/>
    <line x1="60" y1="63" x2="68" y2="63" stroke="#43C463" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>

    <!-- word tile -->
    <rect x="72" y="40" width="46" height="46" rx="14" fill="#06D6A0"/>
    <text x="95" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">One</text>
    <text x="95" y="84" text-anchor="middle" font-size="16">⭐</text>

    <!-- title badge -->
    <rect x="14" y="96" width="100" height="22" rx="11" fill="#FFFFFF" opacity="0.9"/>
    <text x="64" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#4B3F8C">1 = One</text>
</svg>
